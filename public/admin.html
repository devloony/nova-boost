<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA BOOST · ADMIN</title><link rel="stylesheet" href="style.css?v=7"></head><body><div class="app"><main><section class="page active"><div class="hero"><div class="eyebrow">NOVA BOOST</div><h1>АДМИН-ПАНЕЛЬ</h1><p>Управление заказами и отзывами.</p></div><div id="adminMessage" class="message" style="display:block">Проверка доступа…</div><div id="adminContent" style="display:none"><div class="section-title"><span>01</span><div><h2>ЗАКАЗЫ</h2><p>Последние заказы</p></div></div><div id="orders"></div><div class="section-title"><span>02</span><div><h2>ОТЗЫВЫ</h2><p>Модерация</p></div></div><div id="reviews"></div></div></section></main></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()};const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){try{let r=await fetch('/api/admin/check',{headers:headers()}),d=await r.json();if(!d.admin){document.getElementById('adminMessage').textContent='Доступ запрещён. Откройте админ-панель внутри Telegram под админским аккаунтом.';return}document.getElementById('adminMessage').style.display='none';document.getElementById('adminContent').style.display='block';loadOrders();loadReviews()}catch(e){document.getElementById('adminMessage').textContent='Не удалось проверить доступ.'}}
async function loadOrders(){const d=await (await fetch('/api/admin/orders',{headers:headers()})).json();document.getElementById('orders').innerHTML=d.orders.length?d.orders.map(o=>`<div class="review-card"><div class="review-head"><b>${esc(o.id)}</b><b>${esc(o.status)}</b></div><div class="review-text">${esc(o.mode)} · ${esc(o.fromRank)} → ${esc(o.toRank)} · ${esc(o.access)}<br>${o.prices.rub} ₽ / ${o.prices.gold} Gold / ${o.prices.stars} Stars<br>Оплата: ${esc(o.payment)} · ${o.user?.username?'@'+esc(o.user.username):esc(o.user?.first_name||'')}</div><select onchange="status('${o.id}',this.value)"><option>Ожидает оплаты</option><option>Оплачен</option><option>В работе</option><option>Завершён</option><option>Отменён</option></select></div>`).join(''):'<div class="empty-card"><h3>Заказов пока нет</h3></div>'}
async function status(id,s){await fetch('/api/admin/order-status',{method:'POST',headers:headers(),body:JSON.stringify({id,status:s})});loadOrders()}
async function loadReviews(){const d=await (await fetch('/api/admin/reviews',{headers:headers()})).json();document.getElementById('reviews').innerHTML=d.reviews.length?d.reviews.map(r=>`<div class="review-card"><div class="review-head"><b>${esc(r.name)}</b><span>${'★'.repeat(r.stars)}</span></div><div class="review-text">${esc(r.text)}<br>Статус: ${r.approved?'опубликован':'на модерации'}</div><button class="secondary-btn" onclick="approve('${r.id}',${!r.approved})">${r.approved?'Скрыть':'Опубликовать'}</button></div>`).join(''):'<div class="empty-card"><h3>Отзывов пока нет</h3></div>'}
async function approve(id,a){await fetch('/api/admin/review',{method:'POST',headers:headers(),body:JSON.stringify({id,approved:a})});loadReviews()};init();
</script></body></html>
