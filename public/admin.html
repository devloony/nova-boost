<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA BOOST · ADMIN</title><link rel="stylesheet" href="style.css?v=8"></head><body><div class="app"><main><section class="page active"><div class="hero"><div class="eyebrow">NOVA BOOST</div><h1>АДМИН-ПАНЕЛЬ</h1><p>Заказы, бустеры, промокоды и отзывы.</p></div><div id="adminMessage" class="message" style="display:block">Проверка доступа…</div><div id="adminContent" style="display:none">
<div id="stats" class="stats-grid"></div>
<div class="section-title"><span>01</span><div><h2>ЗАКАЗЫ</h2><p>Управление заказами</p></div></div><div id="orders"></div>
<div class="section-title"><span>02</span><div><h2>ПРОМОКОДЫ</h2><p>Создание и отключение скидок</p></div></div><div class="promo-admin"><div class="promo-row"><input id="promoCode" maxlength="24" placeholder="Код, например NOVA10"><input id="promoDiscount" type="number" min="1" max="100" placeholder="%" style="max-width:90px"><button class="secondary-btn" onclick="createPromo()">Создать</button></div></div><div id="promos"></div>
<div class="section-title"><span>03</span><div><h2>ОТЗЫВЫ</h2><p>Отзывы клиентов с завершёнными заказами</p></div></div><div id="reviews"></div></div></section></main></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()};const headers=()=>({'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||''});const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function init(){try{let r=await fetch('/api/admin/check',{headers:headers()}),d=await r.json();if(!d.admin){document.getElementById('adminMessage').textContent='Доступ запрещён. Откройте админ-панель внутри Telegram под админским аккаунтом.';return}document.getElementById('adminMessage').style.display='none';document.getElementById('adminContent').style.display='block';loadAll()}catch(e){document.getElementById('adminMessage').textContent='Не удалось проверить доступ.'}}
async function loadAll(){loadStats();loadOrders();loadPromos();loadReviews()}
async function loadStats(){const d=await (await fetch('/api/admin/stats',{headers:headers()})).json();if(!d.ok)return;const s=d.stats;document.getElementById('stats').innerHTML=`<div class="stat-card"><b>${s.total}</b><span>Всего заказов</span></div><div class="stat-card"><b>${s.active}</b><span>Активных</span></div><div class="stat-card"><b>${s.completed}</b><span>Завершено</span></div><div class="stat-card"><b>${s.revenueRub} ₽</b><span>Оборот по прайсу</span></div>`}
async function loadOrders(){const d=await (await fetch('/api/admin/orders',{headers:headers()})).json();document.getElementById('orders').innerHTML=d.orders.length?d.orders.map(o=>`<div class="review-card"><div class="review-head"><b>${esc(o.id)}</b><b>${esc(o.status)}</b></div><div class="review-text">${esc(o.mode==='allies'?'Allies':'MM')} · ${esc(o.fromRank)} → ${esc(o.toRank)} · ${esc(o.access==='with'?'Со входом':'Без входа')}<br>${o.prices.rub} ₽ / ${o.prices.gold} Gold / ${o.prices.stars} Stars${o.promoCode?`<br>Промокод: ${esc(o.promoCode)} (−${o.discountPercent}%)`:''}<br>Оплата: ${esc(o.payment)} · ${o.user?.username?'@'+esc(o.user.username):esc(o.user?.first_name||'имя не указано')} · ID: ${esc(o.user?.id||'не указан')}</div><div class="admin-actions"><select onchange="status('${o.id}',this.value)">${['Ожидает оплаты','Оплачен','В работе','Завершён','Отменён'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select><input value="${esc(o.booster||'')}" placeholder="Бустер / @username" id="booster-${esc(o.id)}"><button class="secondary-btn" onclick="booster('${o.id}')">Назначить</button><button class="danger-btn" onclick="deleteOrder('${o.id}')">Удалить</button></div>${o.booster?`<div class="review-meta">Бустер: ${esc(o.booster)}</div>`:''}</div>`).join(''):'<div class="empty-card"><h3>Заказов пока нет</h3></div>'}
async function status(id,s){try{const r=await fetch('/api/admin/order-status',{method:'POST',headers:headers(),body:JSON.stringify({id,status:s})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Не удалось изменить статус');loadAll()}catch(e){alert(e.message)}}
async function deleteOrder(id){if(!confirm(`Удалить заказ ${id}?\n\nЭто действие нельзя отменить.`))return;try{const r=await fetch('/api/admin/order-delete',{method:'POST',headers:headers(),body:JSON.stringify({id})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Не удалось удалить заказ');loadAll()}catch(e){alert(e.message)}}
async function booster(id){const v=document.getElementById('booster-'+id).value;await fetch('/api/admin/order-booster',{method:'POST',headers:headers(),body:JSON.stringify({id,booster:v})});loadOrders()}
async function loadPromos(){const d=await (await fetch('/api/admin/promos',{headers:headers()})).json();document.getElementById('promos').innerHTML=d.promos.length?d.promos.map(p=>`<div class="review-card"><div class="review-head"><b>${esc(p.code)}</b><span>${p.discount}%</span></div><div class="review-text">Статус: ${p.active!==false?'активен':'выключен'}</div><button class="secondary-btn" onclick="togglePromo('${esc(p.code)}')">${p.active!==false?'Отключить':'Включить'}</button></div>`).join(''):'<div class="empty-card"><h3>Промокодов пока нет</h3></div>'}
async function createPromo(){const code=document.getElementById('promoCode').value,discount=document.getElementById('promoDiscount').value;const r=await fetch('/api/admin/promo',{method:'POST',headers:headers(),body:JSON.stringify({code,discount})});const d=await r.json();if(!d.ok)return alert(d.error);document.getElementById('promoCode').value='';document.getElementById('promoDiscount').value='';loadPromos();loadStats()}
async function togglePromo(code){await fetch('/api/admin/promo-toggle',{method:'POST',headers:headers(),body:JSON.stringify({code})});loadPromos();loadStats()}
async function loadReviews(){const d=await (await fetch('/api/admin/reviews',{headers:headers()})).json();document.getElementById('reviews').innerHTML=d.reviews.length?d.reviews.map(r=>`<div class="review-card"><div class="review-head"><b>${esc(r.name)}</b><span>${'★'.repeat(r.stars)}</span></div><div class="review-text">${esc(r.text)}<br>Заказ: ${esc(r.orderId||'')}<br>Статус: ${r.approved===false?'не опубликован':'опубликован'}</div><button class="secondary-btn" onclick="approve('${r.id}',${!r.approved})">${r.approved?'Скрыть':'Опубликовать'}</button>${r.approved===false?` <button class="danger-btn" onclick="deleteReview('${r.id}')">Удалить</button>`:''}</div>`).join(''):'<div class="empty-card"><h3>Отзывов пока нет</h3></div>'}
async function approve(id,a){const r=await fetch('/api/admin/review',{method:'POST',headers:headers(),body:JSON.stringify({id,approved:a})});const d=await r.json();if(!r.ok||!d.ok)return alert(d.error||'Не удалось изменить публикацию');loadReviews();loadStats()}
async function deleteReview(id){if(!confirm('Удалить этот неопубликованный отзыв?\n\nЭто действие нельзя отменить.'))return;try{const r=await fetch('/api/admin/review-delete',{method:'POST',headers:headers(),body:JSON.stringify({id})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Не удалось удалить отзыв');loadReviews();loadStats()}catch(e){alert(e.message)}};init();
</script></body></html>
